services:
  postgres:
    image: postgres:16-alpine
    container_name: sistema-ecomm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecomm
      POSTGRES_PASSWORD: ecomm
      POSTGRES_DB: sistema_ecomm
    ports:
      - "5432:5432"
    volumes:
      - ecomm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecomm -d sistema_ecomm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecomm_pgdata:
